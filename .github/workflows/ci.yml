name: ci
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - name: Wireshark (oracle for internal/difftest)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark; else brew install wireshark; fi
        continue-on-error: true
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/lazysniffer
